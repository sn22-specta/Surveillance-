<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radar Mobile</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  
  #container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #wrapper { position: relative; max-width: 100%; max-height: 100%; }
  #video { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  
  #ui {
    position: absolute; top: 8px; left: 8px; right: 8px;
    background: rgba(0,0,0,0.75); padding: 10px; border-radius: 10px;
    font-size: 13px; backdrop-filter: blur(6px);
  }
  #ui .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 6px; }
  #speed { color: #ff0; font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #plate { color: #0ff; font-size: 16px; letter-spacing: 2px; }
  button {
    background: #06f; color: #fff; border: none; padding: 9px 14px;
    border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #048; transform: scale(0.96); }
  input[type=number] { width: 55px; padding: 5px; border-radius: 6px; border: none; text-align: center; }
  
  #modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    z-index: 100; padding: 15px; flex-direction: column; align-items: center; justify-content: center;
  }
  #modal img { max-width: 100%; max-height: 55vh; border: 2px solid #0ff; border-radius: 8px; }
  #ocrResult { color: #0ff; font-size: 18px; margin-top: 15px; text-align: center; word-break: break-all; line-height: 1.5; }
  #ocrResult small { color: #888; font-size: 12px; }
</style>
</head>
<body>
<div id="container">
  <div id="wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
</div>

<div id="ui">
  <div class="row">
    <span>🚗 <span id="speed">--</span> km/h</span>
    <span>🪪 <span id="plate">--</span></span>
  </div>
  <div class="row">
    <span>Distance lignes <input id="calDist" type="number" value="10" step="1"> m</span>
    <button id="btnFlip">🔄</button>
  </div>
  <div class="row">
    <button id="btnPlate" style="flex:1">📸 Capturer plaque</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="row" style="font-size:11px; color:#aaa;">
    <span id="status">Initialisation...</span>
  </div>
</div>

<div id="modal">
  <img id="plateImg" alt="Capture">
  <div id="ocrResult">Analyse...</div>
  <button id="btnClose" style="margin-top:20px; background:#333;">Fermer</button>
</div>

<canvas id="process" style="display:none"></canvas>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
  const procCanvas = $('process'), pctx = procCanvas.getContext('2d', { willReadFrequently: true });
  
  const PW = 320, PH = 240;
  procCanvas.width = PW; procCanvas.height = PH;
  
  const LINE_A = 0.28;   // 28% de la largeur
  const LINE_B = 0.72;   // 72% de la largeur
  const TOLERANCE = 0.04; // 4% de la largeur
  const MIN_MOTION_PX = 150;
  const SESSION_TIMEOUT = 12000;
  
  let prevFrame = null;
  let session = null;
  let facing = 'environment';
  let loopTimer = null;
  
  function setStatus(msg) { $('status').textContent = msg; }
  
  function updateCanvasSize() {
    if (!video.videoWidth) return;
    if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      prevFrame = null;
    }
  }
  
  async function startCamera() {
    try {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        updateCanvasSize();
        setStatus(`✅ Caméra ${video.videoWidth}×${video.videoHeight}`);
        if (loopTimer) clearInterval(loopTimer);
        loopTimer = setInterval(processFrame, 100);
      };
    } catch (e) {
      setStatus('❌ ' + e.message);
      alert('Caméra inaccessible.\n\n' + e.message + 
            '\n\n⚠️ Vérifiez que la page est servie en HTTPS.');
    }
  }
  
  function processFrame() {
    if (video.readyState < 2 || !video.videoWidth) return;
    updateCanvasSize();
    
    // Frame downscaled
    pctx.drawImage(video, 0, 0, PW, PH);
    const current = pctx.getImageData(0, 0, PW, PH);
    
    // Overlay : lignes de guidage
    octx.clearRect(0, 0, overlay.width, overlay.height);
    const lineAx = overlay.width * LINE_A;
    const lineBx = overlay.width * LINE_B;
    octx.lineWidth = Math.max(2, overlay.width / 300);
    octx.setLineDash([12, 8]);
    octx.strokeStyle = session ? 'rgba(0,255,255,0.9)' : 'rgba(255,255,0,0.7)';
    octx.beginPath();
    octx.moveTo(lineAx, 0); octx.lineTo(lineAx, overlay.height);
    octx.moveTo(lineBx, 0); octx.lineTo(lineBx, overlay.height);
    octx.stroke();
    octx.setLineDash([]);
    
    // Étiquettes
    octx.fillStyle = 'rgba(255,255,0,0.9)';
    octx.font = `bold ${Math.max(12, overlay.width/50)}px sans-serif`;
    octx.fillText('A', lineAx + 6, 24);
    octx.fillText('B', lineBx + 6, 24);
    
    if (!prevFrame) { prevFrame = current; return; }
    
    // Différence de frames
    const data = current.data, prev = prevFrame.data;
    let sumX = 0, sumY = 0, count = 0;
    
    for (let i = 0; i < data.length; i += 4) {
      const d = Math.abs(data[i] - prev[i]) + 
                Math.abs(data[i+1] - prev[i+1]) + 
                Math.abs(data[i+2] - prev[i+2]);
      if (d > 60) {
        const p = i >> 2;
        sumX += p % PW;
        sumY += (p / PW) | 0;
        count++;
      }
    }
    
    if (count > MIN_MOTION_PX) {
      const cx = (sumX / count / PW) * overlay.width;
      const cy = (sumY / count / PH) * overlay.height;
      
      // Centroïde visuel
      octx.fillStyle = '#ff2d55';
      octx.beginPath();
      octx.arc(cx, cy, 10, 0, Math.PI * 2);
      octx.fill();
      octx.strokeStyle = '#fff';
      octx.lineWidth = 2;
      octx.stroke();
      
      // Gestion de la session
      const tol = overlay.width * TOLERANCE;
      
      if (!session) {
        session = { t0: null, tB: null, crossedA: false, crossedB: false, startTime: performance.now() };
      }
      
      if (!session.crossedA && Math.abs(cx - lineAx) < tol) {
        session.crossedA = true;
        session.t0 = performance.now();
        setStatus('📏 Ligne A franchie...');
      }
      
      if (session.crossedA && !session.crossedB && Math.abs(cx - lineBx) < tol) {
        session.crossedB = true;
        session.tB = performance.now();
        const dt = (session.tB - session.t0) / 1000;
        const dist = parseFloat($('calDist').value) || 10;
        if (dt > 0.05) {
          const kmh = (dist / dt) * 3.6;
          $('speed').textContent = kmh.toFixed(1);
          setStatus(`✅ ${dt.toFixed(2)}s → ${kmh.toFixed(1)} km/h`);
        }
        setTimeout(() => { session = null; }, 2000);
      }
      
      // Timeout
      if (session && performance.now() - session.startTime > SESSION_TIMEOUT) {
        session = null;
        setStatus('⏱️ Session expirée');
      }
      
    } else if (session && performance.now() - session.startTime > SESSION_TIMEOUT) {
      session = null;
      setStatus('⏱️ Session expirée');
    }
    
    prevFrame = current;
  }
  
  async function capturePlate() {
    if (!video.videoWidth) return;
    const modal = $('modal'), img = $('plateImg'), result = $('ocrResult');
    
    const snap = document.createElement('canvas');
    snap.width = video.videoWidth;
    snap.height = video.videoHeight;
    snap.getContext('2d').drawImage(video, 0, 0);
    img.src = snap.toDataURL('image/jpeg', 0.9);
    
    modal.style.display = 'flex';
    result.textContent = '⏳ Chargement OCR (peut prendre 10-30s la 1ère fois)...';
    
    try {
      const { data } = await Tesseract.recognize(snap, 'fra', {
        logger: m => {
          if (m.status === 'recognizing text') {
            result.textContent = `🔍 OCR ${(m.progress * 100).toFixed(0)}%`;
          }
        }
      });
      const cleaned = data.text.replace(/[^A-Z0-9\-\s]/gi, ' ').replace(/\s+/g, ' ').trim();
      result.innerHTML = `📄 <strong>${cleaned || '(aucun texte détecté)'}</strong><br>
        <small>Confiance: ${(data.confidence || 0).toFixed(0)}%</small>`;
      if (cleaned.length >= 3) $('plate').textContent = cleaned.substring(0, 14);
    } catch (e) {
      result.textContent = '❌ Erreur OCR : ' + e.message;
    }
  }
  
  // Événements
  $('btnFlip').onclick = () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    prevFrame = null; session = null;
    startCamera();
  };
  $('btnPlate').onclick = capturePlate;
  $('btnClose').onclick = () => { $('modal').style.display = 'none'; };
  $('btnReset').onclick = () => {
    session = null; prevFrame = null;
    $('speed').textContent = '--';
    setStatus('🔄 Réinitialisé');
  };
  window.addEventListener('resize', updateCanvasSize);
  window.addEventListener('orientationchange', () => setTimeout(updateCanvasSize, 400));
  
  // Démarrage
  startCamera();
})();
</script>
</body>
                                                                          </html>
