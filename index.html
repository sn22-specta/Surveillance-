<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RADAR BEAM</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<style>
:root{--bg:#080c14;--pn:#111a2b;--bd:#22314d;--tx:#e5ecf6;--mu:#7a8aa6;--cy:#2ee6d6;--am:#ffb020;--rd:#ff4d5e;--gn:#34d399}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.num{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

header{display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 14px 8px}
.brand{font-weight:800;letter-spacing:.2em;font-size:14px;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--cy);filter:drop-shadow(0 0 6px rgba(46,230,214,.6))}
.fps{font-size:11px;color:var(--mu);display:flex;gap:6px;align-items:center;padding:4px 10px;border-radius:20px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.stage{flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#video{max-width:100%;max-height:100%}
#ov{position:absolute;pointer-events:none}
#camError{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,20,.95);padding:24px;text-align:center;z-index:5}
#camError.show{display:flex}
#camError svg{color:var(--rd);width:44px;height:44px}
#camError p{font-size:13px;color:var(--mu);max-width:320px;line-height:1.5}
#camError button{background:var(--cy);color:#04211f;border:none;padding:11px 22px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}

.dash{display:grid;grid-template-columns:148px 1fr;gap:14px;align-items:center;margin:10px 12px 6px;padding:12px 14px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;transition:all .3s}
.dash.over{border-color:var(--rd);box-shadow:0 0 0 1px var(--rd),0 0 24px rgba(255,77,94,.35);animation:warn 1s infinite}
.dash.valid{border-color:var(--gn);box-shadow:0 0 15px rgba(52,211,153,.4)}
.dash.tracking{border-color:var(--gn);box-shadow:0 0 20px rgba(52,211,153,.5)}
@keyframes warn{0%,100%{box-shadow:0 0 0 1px var(--rd),0 0 24px rgba(255,77,94,.35)}50%{box-shadow:0 0 0 1px var(--rd),0 0 40px rgba(255,77,94,.6)}}
.gauge{position:relative;width:148px;height:88px}
.gauge svg{width:100%;height:100%;overflow:visible}
.gv{position:absolute;left:0;right:0;bottom:0;text-align:center}
#spd{font-size:36px;font-weight:800;line-height:1;color:var(--am);text-shadow:0 0 22px rgba(255,176,32,.4)}
.over #spd{color:var(--rd);text-shadow:0 0 22px rgba(255,77,94,.6)}
#unit{font-size:10px;color:var(--mu);margin-top:2px;font-weight:600;letter-spacing:1px}
#arc{transition:stroke-dasharray .55s cubic-bezier(.34,1.2,.64,1)}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}

.plate{display:flex;height:44px;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,#fafcfe,#dde4eb);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),0 2px 10px rgba(0,0,0,.4)}
.plate i{width:18px;background:linear-gradient(180deg,#0b4aa8,#063578);color:#fdd835;font:700 9px/1 system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;gap:1px}
.plate i::before{content:'★';font-size:7px}
.plate b{flex:1;display:flex;align-items:center;justify-content:center;color:#0a0e17;font:800 21px ui-monospace,Menlo,monospace;letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.meta{font-size:11px;color:var(--mu);display:flex;justify-content:space-between}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 8px}
.stat{background:rgba(17,26,43,.6);border:1px solid var(--bd);border-radius:10px;padding:6px 4px;text-align:center}
.stat b{display:block;font-size:15px;color:var(--am);font-weight:800}
.stat.over b{color:var(--rd)}
.stat small{display:block;font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-top:1px}

.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 8px}
.btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font:600 11px system-ui;cursor:pointer;transition:all .15s}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.95);background:rgba(46,230,214,.1)}
.btn.main{background:linear-gradient(135deg,rgba(46,230,214,.9),rgba(46,230,214,.7));color:#04211f;border-color:var(--cy);box-shadow:0 4px 20px rgba(46,230,214,.3)}

#hist{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
#hist::-webkit-scrollbar{display:none}
#hist .empty{flex:1;text-align:center;padding:12px;color:var(--mu);font-size:12px;background:rgba(17,26,43,.4);border-radius:10px;border:1px dashed var(--bd)}
.card{flex:0 0 auto;display:flex;gap:8px;align-items:center;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:5px 10px 5px 5px;cursor:pointer}
.card:active{border-color:var(--cy)}
.card img{width:52px;height:36px;object-fit:cover;border-radius:5px;background:#000}
.card b{display:block;font-size:14px;color:var(--am);font-weight:800}
.card.ov b{color:var(--rd)}
.card span{font-size:10px;color:var(--mu);letter-spacing:.5px}

#st{padding:2px 14px max(10px,env(safe-area-inset-bottom));font-size:11px;color:var(--mu);font-weight:500;text-align:center;line-height:1.4}
#diag{font-size:10px;color:#4a5a75;font-family:ui-monospace,monospace;padding:0 14px 6px;text-align:center;line-height:1.4}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(4,7,12,.86);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.x{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.row output{color:var(--am);font-size:13px;font-weight:700}
.row input[type=range]{grid-column:1/3;width:100%}
.row small{grid-column:1/3;color:var(--mu);font-size:11px}
.grp{font-size:11px;color:var(--cy);font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:1px}

input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--bg);border-radius:2px;outline:none;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--cy);border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px rgba(46,230,214,.2),0 2px 6px rgba(0,0,0,.4)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:44px;height:24px;background:var(--bg);border-radius:12px;position:relative;cursor:pointer;border:1px solid var(--bd);transition:all .2s;flex-shrink:0}
input[type=checkbox]::before{content:'';position:absolute;width:18px;height:18px;background:var(--mu);border-radius:50%;top:2px;left:2px;transition:all .2s}
input[type=checkbox]:checked{background:var(--cy);border-color:var(--cy)}
input[type=checkbox]:checked::before{left:22px;background:#fff}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:13px}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pimg{width:100%;max-height:30vh;object-fit:contain;background:#000;border-radius:8px;border:1px solid var(--bd)}
.big{text-align:center;font:800 26px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--cy);padding:12px;background:var(--bg);border-radius:10px;word-break:break-all;outline:none;border:1px solid transparent}
.big:focus{border-color:var(--cy);background:#0d1524}
.edit-hint{font-size:10px;color:var(--mu);text-align:center;margin-top:-6px;font-style:italic}
.recal{background:rgba(46,230,214,.15);border:1px solid var(--cy);color:var(--cy);padding:11px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
.recal:active{background:rgba(46,230,214,.3)}

@media(orientation:landscape) and (max-height:560px){
  .dash{padding:6px 10px;margin:6px 10px}.btn{padding:6px 2px}.btn svg{display:none}
  .gauge{width:110px;height:64px}#spd{font-size:26px}.plate{height:32px}.plate b{font-size:16px}
  .stats{padding:0 8px 6px}.stat b{font-size:12px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>
    RADAR
  </div>
  <div class="fps"><span class="dot"></span><span id="fps" class="num">-- fps</span></div>
</header>

<main class="stage" id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>
  <div id="camError">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p id="camErrMsg">La caméra n'est pas accessible.</p>
    <button id="btnRetry">Réessayer</button>
  </div>
</main>

<section class="dash" id="dash">
  <div class="gauge">
    <svg viewBox="0 0 128 76">
      <g id="ticks" stroke="#2a3b57" stroke-width="1"></g>
      <path d="M10 68A54 54 0 0 1 118 68" fill="none" stroke="#1e2b44" stroke-width="9" stroke-linecap="round"/>
      <path id="arc" d="M10 68A54 54 0 0 1 118 68" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 170"/>
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset=".6" stop-color="#ffb020"/><stop offset="1" stop-color="#ff4d5e"/></linearGradient></defs>
    </svg>
    <div class="gv"><div id="spd" class="num">--</div><div id="unit">km/h</div></div>
  </div>
  <div class="side">
    <div class="plate"><i>F</i><b id="plate">-- --</b></div>
    <div class="meta"><span id="dt">Temps : --</span><span id="dir">Sens : --</span></div>
  </div>
</section>

<section class="stats">
  <div class="stat"><b id="stCount" class="num">0</b><small>Passages</small></div>
  <div class="stat"><b id="stAvg" class="num">--</b><small>Moyenne</small></div>
  <div class="stat"><b id="stMax" class="num">--</b><small>Max</small></div>
  <div class="stat over"><b id="stOver" class="num">0</b><small>Excès</small></div>
</section>

<section class="ctl">
  <button class="btn main" id="bCap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>Lire plaque</button>
  <button class="btn" id="bFlip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>Caméra</button>
  <button class="btn" id="bReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7M3 4v6h6"/></svg>Reset</button>
  <button class="btn" id="bSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Réglages</button>
</section>
<div id="hist"><div class="empty">Aucun passage enregistré</div></div>
<div id="st">Initialisation…</div>
<div id="diag" class="num">—</div>

<div class="sheet" id="shSet"><div class="panel">
  <div class="ph">Réglages<button class="x" data-close>✕</button></div>
  <div id="fields" style="display:flex;flex-direction:column;gap:12px"></div>
  <button class="recal" id="bRecal">🔄 Recalibrer le fond</button>
  <div class="sw">Unité<select id="unitSel"><option value="kmh">km/h</option><option value="mph">mph</option></select></div>
  <div class="sw">Lecture auto de la plaque<input type="checkbox" id="autoOcr"></div>
  <div class="sw">Afficher la zone plaque<input type="checkbox" id="showZone"></div>
  <div class="sw">Bip sonore<input type="checkbox" id="soundOn"></div>
  <div class="two"><button class="btn" id="bCsv">Exporter CSV</button><button class="btn" id="bDef">Défaut</button></div>
</div></div>

<div class="sheet" id="shPl"><div class="panel">
  <div class="ph"><span id="plT">Plaque</span><button class="x" data-close>✕</button></div>
  <img id="plFull" class="pimg" alt="Capture">
  <img id="plCrop" class="pimg" alt="Zone plaque" style="max-height:90px">
  <div class="big" id="plTxt" contenteditable="true" spellcheck="false"></div>
  <div class="edit-hint">Touchez le texte pour le corriger</div>
  <div class="meta" id="plMeta"></div>
  <div class="two"><button class="btn" id="bRe">Relire</button><a class="btn" id="bDl" download="capture.jpg">Télécharger</a></div>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const video=$('video'),ov=$('ov'),oc=ov.getContext('2d'),stage=$('stage');

const PW=160,PH=90;
const pcv=document.createElement('canvas');pcv.width=PW;pcv.height=PH;
const pc=pcv.getContext('2d',{willReadFrequently:true});

/* ---------- Réglages ---------- */
const D={dist:1,a:28,b:72,top:15,bot:95,sens:22,noiseK:3,area:12,entryTol:12,limit:0,px:30,py:55,pw:40,ph:20,auto:true,unit:'kmh',zone:true,sound:true};
const F=[
 ['Mesure'],
 ['dist','Distance réelle entre A et B','m',.1,100,.1,'Calibrage : distance réelle au sol'],
 ['a','Ligne A (faisceau)','%',5,95,1],['b','Ligne B (faisceau)','%',5,95,1],
 ['limit','Limite de vitesse (0 = aucune)','km/h',0,200,5],
 ['Détection pixel'],
 ['top','Bande de détection : haut','%',0,90,1],['bot','Bande de détection : bas','%',10,100,1],
 ['sens','Seuil de mouvement','',5,120,1,'Plus bas = plus sensible'],
 ['noiseK','Sensibilité au bruit (× σ)','σ',1,5,.5,'Augmentez si du bruit passe'],
 ['area','Pixels mini par faisceau','px',3,80,1,'Baisser pour détecter de très petits objets'],
 ['Zone plaque'],
 ['px','Position X','%',0,95,1],['py','Position Y','%',0,95,1],['pw','Largeur','%',5,100,1],['ph','Hauteur','%',3,100,1]
];
let S={...D};
try{Object.assign(S,JSON.parse(localStorage.getItem('radar.beam')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('radar.beam',JSON.stringify(S))}catch(e){}};

function buildFields(){
  const box=$('fields');box.innerHTML='';
  F.forEach(f=>{
    if(f.length===1){box.insertAdjacentHTML('beforeend',`<div class="grp">${f[0]}</div>`);return}
    const [k,l,u,mn,mx,st,h]=f,r=document.createElement('label');r.className='row';
    r.innerHTML=`<span>${l}</span><output class="num">${S[k]} ${u}</output><input type="range" min="${mn}" max="${mx}" step="${st}" value="${S[k]}">${h?`<small>${h}</small>`:''}`;
    r.querySelector('input').oninput=e=>{S[k]=+e.target.value;r.querySelector('output').textContent=S[k]+' '+u;save()};
    box.appendChild(r);
  });
  $('unitSel').value=S.unit;$('autoOcr').checked=S.auto;$('showZone').checked=S.zone;$('soundOn').checked=S.sound;
}
$('unitSel').onchange=e=>{S.unit=e.target.value;$('unit').textContent=S.unit==='mph'?'mph':'km/h';save();updateStats()};
$('autoOcr').onchange=e=>{S.auto=e.target.checked;save()};
$('showZone').onchange=e=>{S.zone=e.target.checked;save()};
$('soundOn').onchange=e=>{S.sound=e.target.checked;save();if(e.target.checked)ensureAudio()};
$('bDef').onclick=()=>{S={...D};save();buildFields();$('unit').textContent='km/h'};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.sheet').classList.remove('open'));
$('bSet').onclick=()=>{$('shSet').classList.add('open');ensureAudio()};
$('bRecal').onclick=()=>{
  bgMean=null;bgVar=null;warmupFrames=0;
  state='IDLE';$('dash').classList.remove('tracking');
  status('Fond recalibré — attendez 2 s','ok');
  $('shSet').classList.remove('open');
};

const status=(m,c)=>{const e=$('st');e.textContent=m;e.style.color=c==='ok'?'var(--gn)':c==='err'?'var(--rd)':c==='track'?'var(--gn)':'var(--mu)'};
const diag=(m)=>{$('diag').innerHTML=m};
const conv=k=>S.unit==='mph'?k*0.621371:k;
const fmt=v=>`${v.toFixed(1)} ${S.unit==='mph'?'mph':'km/h'}`;

/* ---------- Audio ---------- */
let actx=null;
function ensureAudio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function beep(freq=880,dur=.08,vol=.12){if(!S.sound||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.setValueAtTime(freq,actx.currentTime);g.gain.setValueAtTime(.001,actx.currentTime);g.gain.exponentialRampToValueAtTime(vol,actx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur+.01)}catch(e){}}
document.addEventListener('pointerdown',ensureAudio,{once:true,passive:true});

/* ---------- Graduations ---------- */
(function(){
  const g=$('ticks');
  for(let i=0;i<=10;i++){
    const a=Math.PI+i*Math.PI/10,cx=64,cy=68,r1=62,r2=56;
    const x1=cx+r1*Math.cos(a),y1=cy+r1*Math.sin(a),x2=cx+r2*Math.cos(a),y2=cy+r2*Math.sin(a);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1.toFixed(1));l.setAttribute('y1',y1.toFixed(1));
    l.setAttribute('x2',x2.toFixed(1));l.setAttribute('y2',y2.toFixed(1));
    l.setAttribute('stroke',i%5===0?'#7a8aa6':'#2a3b57');
    l.setAttribute('stroke-width',i%5===0?'1.5':'1');
    g.appendChild(l);
  }
})();

/* ---------- Stats ---------- */
const stats={count:0,sum:0,max:0,over:0};
try{Object.assign(stats,JSON.parse(localStorage.getItem('radar.stats')||'{}'))}catch(e){}
function addStat(kmh,over){stats.count++;stats.sum+=kmh;if(kmh>stats.max)stats.max=kmh;if(over)stats.over++;try{localStorage.setItem('radar.stats',JSON.stringify(stats))}catch(e){}updateStats()}
function updateStats(){
  $('stCount').textContent=stats.count;
  $('stAvg').textContent=stats.count?conv(stats.sum/stats.count).toFixed(0):'--';
  $('stMax').textContent=stats.max?conv(stats.max).toFixed(0):'--';
  $('stOver').textContent=stats.over;
}

/* ---------- Caméra ---------- */
let facing='environment',frames=0,fpsT=performance.now(),flashT=0,currentFps=0;
function sync(){
  const v=video.getBoundingClientRect(),s=stage.getBoundingClientRect();
  if(!v.width)return;
  const w=Math.round(v.width),h=Math.round(v.height);
  if(ov.width!==w||ov.height!==h){ov.width=w;ov.height=h}
  ov.style.cssText=`width:${w}px;height:${h}px;left:${v.left-s.left}px;top:${v.top-s.top}px`;
}
function showCamError(msg){$('camErrMsg').textContent=msg;$('camError').classList.add('show')}
function hideCamError(){$('camError').classList.remove('show')}
async function startCam(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      showCamError('getUserMedia indisponible. Utilisez Chrome/Firefox récent en HTTPS.');return;
    }
    if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
    video.srcObject=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false
    });
    await video.play().catch(()=>{});
    hideCamError();bgMean=null;bgVar=null;warmupFrames=0;
    state='IDLE';$('dash').classList.remove('tracking');
    status('Caméra prête — attendez 2 s','ok');
  }catch(e){
    const msg=e.name==='NotAllowedError'?'Permission refusée. Autorisez la caméra.'
      :e.name==='NotFoundError'?'Aucune caméra détectée.':'Erreur : '+e.message;
    showCamError(msg);status('Caméra inaccessible','err');
  }
}
let loopRunning=false;
function startLoop(){
  if(loopRunning)return;loopRunning=true;
  setInterval(()=>{try{process(performance.now())}catch(e){console.error(e);diag('Erreur : '+e.message)}},33);
}

/* ============================================================
   BACKGROUND ADAPTATIF + FAISCEAUX
   ============================================================ */
let bgMean=null,bgVar=null,warmupFrames=0;
const WARMUP=20,ALPHA_IDLE=0.03,ALPHA_MOVE=0.002;

/* État du radar */
let state='IDLE';
let armTime=0,lastMotionTime=0,aHoldStart=0,bHoldStart=0;
let colMotion=new Float32Array(PW);
let centroidX=0,corridorMotion=0,motionAtA=0,motionAtB=0;
let centroidHistory=[];
let liveSpeed=0;

function process(t){
  if(++frames>=10){
    currentFps=Math.round(frames*1000/(t-fpsT));
    if(currentFps>0&&currentFps<999)$('fps').textContent=currentFps+' fps';
    frames=0;fpsT=t;
  }
  if(!video.videoWidth||video.readyState<2){diag('En attente de la caméra…');return}
  sync();
  pc.drawImage(video,0,0,PW,PH);
  const d=pc.getImageData(0,0,PW,PH).data,n=PW*PH;

  if(!bgMean||bgMean.length!==n){
    bgMean=new Float32Array(n);
    bgVar=new Float32Array(n);
    for(let i=0;i<n;i++)bgMean[i]=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;
    warmupFrames=0;
    diag(`Calibration… (${WARMUP} frames)`);
    draw(t);return;
  }

  const y0=Math.floor(S.top/100*PH);
  const y1=Math.max(y0+1,Math.ceil(S.bot/100*PH));
  const xAi=Math.round(S.a/100*PW);
  const xBi=Math.round(S.b/100*PW);

  const warming=warmupFrames<WARMUP;
  if(warming)warmupFrames++;

  /* Motion pixel-par-pixel dans la bande */
  colMotion.fill(0);
  let totalMoved=0;
  for(let y=y0;y<y1;y++){
    const rowOff=y*PW;
    for(let x=0;x<PW;x++){
      const i=rowOff+x;
      const g=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;
      const diff=Math.abs(g-bgMean[i]);
      const sigma=Math.sqrt(bgVar[i]+1);
      const thr=Math.max(S.sens,S.noiseK*sigma);
      const moving=diff>thr;

      if(warming){
        const delta=g-bgMean[i];
        bgMean[i]+=delta/warmupFrames;
        bgVar[i]=bgVar[i]*0.9+delta*delta*0.1;
      }else{
        const alpha=moving?ALPHA_MOVE:ALPHA_IDLE;
        const old=bgMean[i];
        bgMean[i]+=alpha*(g-old);
        bgVar[i]=bgVar[i]*(1-alpha)+alpha*(g-old)*(g-old);
        if(moving){colMotion[x]++;totalMoved++}
      }
    }
  }

  if(warming){diag(`Calibration ${warmupFrames}/${WARMUP}`);draw(t);return}

  /* Reset auto si toute l'image change */
  if(totalMoved>0.6*PW*(y1-y0)){
    bgMean=null;bgVar=null;warmupFrames=0;state='IDLE';
    $('dash').classList.remove('tracking');
    status('Changement de scène — recalibration','err');
    draw(t);return;
  }

  /* Faisceaux A et B (±4 colonnes) */
  const beamTol=4;
  motionAtA=0;motionAtB=0;
  for(let x=xAi-beamTol;x<=xAi+beamTol;x++){if(x>=0&&x<PW)motionAtA+=colMotion[x]}
  for(let x=xBi-beamTol;x<=xBi+beamTol;x++){if(x>=0&&x<PW)motionAtB+=colMotion[x]}

  /* Corridor + centroïde */
  corridorMotion=0;
  let sumX=0;
  const cStart=Math.max(0,Math.min(xAi,xBi));
  const cEnd=Math.min(PW-1,Math.max(xAi,xBi));
  for(let x=cStart;x<=cEnd;x++){corridorMotion+=colMotion[x];sumX+=x*colMotion[x]}
  centroidX=corridorMotion>0?sumX/corridorMotion:0;

  /* Historique centroïde pour vitesse live */
  centroidHistory.push({x:centroidX,t});
  while(centroidHistory.length>25)centroidHistory.shift();
  liveSpeed=0;
  if(centroidHistory.length>5){
    const first=centroidHistory[0],last=centroidHistory[centroidHistory.length-1];
    const dx=(last.x-first.x)/PW,dt=(last.t-first.t)/1000;
    if(dt>0.05&&Math.abs(dx)>0.01)liveSpeed=Math.abs(dx*S.dist/dt*3.6);
  }

  /* Machine à états (beam-break) */
  updateBeamState(t,motionAtA,motionAtB,xAi,xBi);

  diag(`FPS ${currentFps} · A ${Math.round(motionAtA)} · B ${Math.round(motionAtB)} · Corr ${corridorMotion} · ${state}`);
  draw(t);
}

/* ============================================================
   BEAM-BREAK STATE MACHINE
   IDLE → ARMED_A/B → finish
   ============================================================ */
function updateBeamState(t,mA,mB,xAi,xBi){
  const beamThresh=Math.max(4,S.area);
  const holdMs=80;
  const minElapsed=0.05;
  const maxElapsed=15;
  const lostTimeout=1500;

  if(state==='IDLE'){
    /* Entrée A ? */
    if(mA>beamThresh){
      if(!aHoldStart)aHoldStart=t;
      if(t-aHoldStart>holdMs){
        state='ARMED_A';armTime=t;lastMotionTime=t;
        aHoldStart=0;bHoldStart=0;centroidHistory=[];
        beep(660);
        $('dash').classList.add('tracking');
        status(`🔒 Entrée A détectée — attente de B…`,'track');
      }
    }else aHoldStart=0;

    /* Entrée B ? */
    if(mB>beamThresh){
      if(!bHoldStart)bHoldStart=t;
      if(t-bHoldStart>holdMs){
        state='ARMED_B';armTime=t;lastMotionTime=t;
        aHoldStart=0;bHoldStart=0;centroidHistory=[];
        beep(660);
        $('dash').classList.add('tracking');
        status(`🔒 Entrée B détectée — attente de A…`,'track');
      }
    }else bHoldStart=0;

  }else if(state==='ARMED_A'){
    /* Sortie B ? */
    if(mB>beamThresh){
      const elapsed=(t-armTime)/1000;
      if(elapsed>minElapsed&&elapsed<maxElapsed){
        const kmh=S.dist/elapsed*3.6;
        if(kmh>0&&kmh<400){finish(kmh,elapsed,1);state='IDLE';$('dash').classList.remove('tracking');return}
      }
      state='IDLE';$('dash').classList.remove('tracking');return;
    }
    if(mA>beamThresh||corridorMotion>beamThresh)lastMotionTime=t;
    if(t-lastMotionTime>lostTimeout||t-armTime>maxElapsed*1000){
      state='IDLE';$('dash').classList.remove('tracking');
      status('Abandon — objet perdu','err');
    }

  }else if(state==='ARMED_B'){
    /* Sortie A ? */
    if(mA>beamThresh){
      const elapsed=(t-armTime)/1000;
      if(elapsed>minElapsed&&elapsed<maxElapsed){
        const kmh=S.dist/elapsed*3.6;
        if(kmh>0&&kmh<400){finish(kmh,elapsed,-1);state='IDLE';$('dash').classList.remove('tracking');return}
      }
      state='IDLE';$('dash').classList.remove('tracking');return;
    }
    if(mB>beamThresh||corridorMotion>beamThresh)lastMotionTime=t;
    if(t-lastMotionTime>lostTimeout||t-armTime>maxElapsed*1000){
      state='IDLE';$('dash').classList.remove('tracking');
      status('Abandon — objet perdu','err');
    }
  }
}

/* ---------- Finish ---------- */
function finish(kmh,dt,dir){
  const v=conv(kmh);
  $('spd').textContent=v.toFixed(1);
  let scale;
  if(S.limit>0){scale=Math.max(S.limit*1.15,kmh*1.15,20)}
  else{scale=Math.max(20,Math.ceil(kmh/10)*10);if(kmh>0&&kmh/scale<0.6)scale=kmh/0.85}
  $('arc').setAttribute('stroke-dasharray',`${Math.min(1,kmh/scale)*169.6} 170`);
  $('dt').textContent=`Temps : ${dt.toFixed(2)} s`;
  $('dir').textContent=dir>0?'Sens : A → B':'Sens : B → A';
  const over=S.limit>0&&kmh>S.limit;
  $('dash').classList.toggle('over',over);
  $('dash').classList.add('valid');
  $('dash').classList.remove('tracking');
  flashT=performance.now()+1200;
  status(`✅ ${fmt(v)} · ${dir>0?'A→B':'B→A'}`,over?'err':'ok');
  if(over){beep(440,.1,.2);setTimeout(()=>beep(440,.1,.2),150)}else beep(880,.08,.15);
  if(navigator.vibrate)navigator.vibrate(over?[120,60,120]:40);
  addStat(kmh,over);
  const e=snap(kmh,over);addHist(e);
  if(S.auto)runOcr(e);
}

/* ---------- Overlay ---------- */
function draw(t){
  const W=ov.width,H=ov.height;
  if(!W||!H)return;
  oc.clearRect(0,0,W,H);
  const ax=S.a/100*W,bx=S.b/100*W,yt=S.top/100*H,yb=S.bot/100*H;
  const xAi=Math.round(S.a/100*PW),xBi=Math.round(S.b/100*PW);

  if(flashT&&t>flashT){$('dash').classList.remove('valid');flashT=0}

  /* Bandes hors détection */
  oc.fillStyle='rgba(0,0,0,.5)';oc.fillRect(0,0,W,yt);oc.fillRect(0,yb,W,H-yb);

  /* Corridor teinté */
  oc.fillStyle='rgba(46,230,214,0.06)';
  const cL=Math.min(ax,bx),cR=Math.max(ax,bx);
  oc.fillRect(cL,yt,cR-cL,yb-yt);

  /* Coins HUD */
  const bl=22,bo=10;oc.strokeStyle='rgba(46,230,214,.65)';oc.lineWidth=2;oc.lineCap='round';
  oc.beginPath();
  oc.moveTo(bo+bl,bo);oc.lineTo(bo,bo);oc.lineTo(bo,bo+bl);
  oc.moveTo(W-bo-bl,bo);oc.lineTo(W-bo,bo);oc.lineTo(W-bo,bo+bl);
  oc.moveTo(bo,H-bo-bl);oc.lineTo(bo,H-bo);oc.lineTo(bo+bl,H-bo);
  oc.moveTo(W-bo,H-bo-bl);oc.lineTo(W-bo,H-bo);oc.lineTo(W-bo-bl,H-bo);
  oc.stroke();

  /* Barres de mouvement par colonne */
  const colW=(cR-cL)/Math.max(1,Math.abs(xBi-xAi));
  for(let x=Math.min(xAi,xBi);x<=Math.max(xAi,xBi);x++){
    if(x<0||x>=PW)continue;
    const m=colMotion[x];
    if(m<=0)continue;
    const barH=Math.min(40,(m/Math.max(1,(yb-yt)/PH))*4);
    const barX=cL+((x-Math.min(xAi,xBi))/(Math.abs(xBi-xAi)||1))*(cR-cL);
    oc.fillStyle='rgba(52,211,153,0.35)';
    oc.fillRect(barX,yb-barH,colW+0.5,barH);
  }

  /* Faisceaux A et B */
  const fs=Math.max(14,W/35);
  const activeA=state==='ARMED_A';
  const activeB=state==='ARMED_B';

  oc.lineWidth=Math.max(3,W/250);oc.setLineDash([10,7]);

  /* Faisceau A */
  oc.strokeStyle=activeA?'#34d399':'rgba(255,176,32,.85)';
  oc.shadowBlur=activeA?18:6;oc.shadowColor=activeA?'rgba(52,211,153,.9)':'rgba(255,176,32,.4)';
  oc.beginPath();oc.moveTo(ax,yt);oc.lineTo(ax,yb);oc.stroke();
  oc.shadowBlur=0;

  /* Faisceau B */
  oc.strokeStyle=activeB?'#34d399':'rgba(255,176,32,.85)';
  oc.shadowBlur=activeB?18:6;oc.shadowColor=activeB?'rgba(52,211,153,.9)':'rgba(255,176,32,.4)';
  oc.beginPath();oc.moveTo(bx,yt);oc.lineTo(bx,yb);oc.stroke();
  oc.setLineDash([]);oc.shadowBlur=0;

  /* Étiquettes A et B */
  oc.font=`700 ${fs}px ui-monospace,monospace`;
  oc.fillStyle=activeA?'#34d399':'#ffb020';oc.fillText('A',ax+8,yt+fs+6);
  oc.fillStyle=activeB?'#34d399':'#ffb020';oc.fillText('B',bx+8,yt+fs+6);

  /* Centroïde */
  if(corridorMotion>5){
    const cx=(centroidX/PW)*W;
    const cy=(yt+yb)/2;
    oc.beginPath();oc.arc(cx,cy,14,0,7);oc.fillStyle='rgba(52,211,153,.2)';oc.fill();
    oc.beginPath();oc.arc(cx,cy,8,0,7);oc.fillStyle='rgba(52,211,153,.6)';oc.fill();
    oc.beginPath();oc.arc(cx,cy,3,0,7);oc.fillStyle='#fff';oc.fill();
    /* Ligne verticale de visée */
    oc.strokeStyle='rgba(52,211,153,.4)';oc.lineWidth=1;oc.setLineDash([3,3]);
    oc.beginPath();oc.moveTo(cx,yt);oc.lineTo(cx,yb);oc.stroke();oc.setLineDash([]);
  }

  /* Vitesse live pendant suivi */
  if(state!=='IDLE'&&liveSpeed>0.1){
    oc.font=`700 ${fs*0.9}px ui-monospace,monospace`;
    oc.fillStyle='#34d399';
    oc.fillText(`≈ ${liveSpeed.toFixed(1)} km/h`,ax+18,yt+fs*2.6);
    const prog=Math.max(0,Math.min(1,Math.abs(centroidX-xAi)/Math.abs(xBi-xAi)));
    oc.font=`600 ${fs*0.7}px ui-monospace,monospace`;
    oc.fillStyle='rgba(52,211,153,.7)';
    oc.fillText(`${Math.round(prog*100)}%`,ax+18,yt+fs*3.8);
  }

  /* Zone plaque */
  if(S.zone){
    const zx=S.px/100*W,zy=S.py/100*H,zw=S.pw/100*W,zh=S.ph/100*H;
    oc.strokeStyle='rgba(52,211,153,.9)';oc.lineWidth=2;oc.setLineDash([5,4]);
    oc.strokeRect(zx,zy,zw,zh);oc.setLineDash([]);
    oc.fillStyle='rgba(52,211,153,.12)';oc.fillRect(zx,zy,zw,zh);
    oc.fillStyle='#34d399';oc.font=`600 ${fs*.7}px system-ui`;
    oc.fillText('PLAQUE',zx+4,zy-4);
  }
}

/* ---------- Historique ---------- */
const hist=[];
function snap(kmh,over){
  const c=document.createElement('canvas'),sc=Math.min(1,1280/video.videoWidth);
  c.width=video.videoWidth*sc;c.height=video.videoHeight*sc;
  c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  return{id:Date.now()+Math.random(),time:new Date(),kmh,over,plate:'',conf:0,ok:false,img:c.toDataURL('image/jpeg',.9)};
}
function addHist(e){hist.unshift(e);if(hist.length>40)hist.pop();renderHist()}
function renderHist(){
  const h=$('hist');
  if(!hist.length){h.innerHTML='<div class="empty">Aucun passage enregistré</div>';return}
  h.innerHTML=hist.map(e=>`<div class="card${e.over?' ov':''}" data-id="${e.id}"><img src="${e.img}" alt=""><div><b class="num">${e.kmh==null?'--':conv(e.kmh).toFixed(0)+(S.unit==='mph'?' mph':' km/h')}</b><span class="num">${e.plate||'plaque ?'}</span></div></div>`).join('');
}
$('hist').onclick=ev=>{const c=ev.target.closest('.card');if(c)openPlate(hist.find(e=>String(e.id)===c.dataset.id))};
$('bCap').onclick=()=>{ensureAudio();if(!video.videoWidth){status('Caméra pas prête','err');return}const e=snap(null,false);addHist(e);openPlate(e);runOcr(e)};

/* ---------- OCR ---------- */
let worker=null,wLoad=null,cur=null;
const toL={0:'O',1:'I',5:'S',8:'B',2:'Z',6:'G',4:'A'},toD={O:0,Q:0,D:0,I:1,L:1,S:5,B:8,Z:2,G:6,T:7};
function parsePlate(txt){
  const c=txt.toUpperCase().replace(/[^A-Z0-9]/g,'');
  for(let i=0;i+7<=c.length;i++){
    let s='';
    for(let j=0;j<7;j++){
      const ch=c[i+j],isL=j<2||j>4;
      s+=isL?(/\d/.test(ch)?(toL[ch]||'?'):ch):(/[A-Z]/.test(ch)?(toD[ch]!==undefined?toD[ch]:'?'):ch);
    }
    if(/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(s))return{plate:`${s.slice(0,2)}-${s.slice(2,5)}-${s.slice(5)}`,score:2};
  }
  const m=c.match(/\d{1,4}[A-Z]{1,3}\d{2}/);
  if(m)return{plate:m[0],score:1};
  return{plate:c.slice(0,10),score:0};
}
function prep(cv,variant=0){
  const sx=S.px/100*cv.width,sy=S.py/100*cv.height,cw=Math.max(8,S.pw/100*cv.width),ch=Math.max(8,S.ph/100*cv.height);
  const k=Math.max(1,Math.min(4,600/cw)),o=document.createElement('canvas');
  o.width=Math.round(cw*k)+40;o.height=Math.round(ch*k)+40;
  const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);
  x.imageSmoothingQuality='high';x.drawImage(cv,sx,sy,cw,ch,20,20,cw*k,ch*k);
  const im=x.getImageData(0,0,o.width,o.height),p=im.data,n=o.width*o.height,g=new Uint8Array(n),h=new Uint32Array(256);
  for(let i=0;i<n;i++){
    let v=(p[i*4]*77+p[i*4+1]*150+p[i*4+2]*29)>>8;
    if(variant===1)v=Math.max(0,Math.min(255,128+(v-128)*1.6));
    g[i]=v;h[v]++;
  }
  let sum=0;for(let i=0;i<256;i++)sum+=i*h[i];
  let wB=0,sB=0,mx=0,th=127;
  for(let i=0;i<256;i++){wB+=h[i];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=i*h[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>mx){mx=v;th=i}}
  let wh=0;for(let i=0;i<n;i++)if(g[i]>th)wh++;
  const inv=wh<n/2||variant===2;
  for(let i=0;i<n;i++){const v=(g[i]>th)!==inv?255:0;p[i*4]=p[i*4+1]=p[i*4+2]=v;p[i*4+3]=255}
  x.putImageData(im,0,0);return o;
}
async function getWorker(){
  if(worker)return worker;
  if(!wLoad)wLoad=(async()=>{
    if(typeof Tesseract==='undefined')throw new Error('Tesseract non chargé');
    const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(cur&&m.status&&$('shPl').classList.contains('open'))$('plTxt').textContent=m.status==='recognizing text'?`Lecture ${Math.round(m.progress*100)}%`:'Chargement…'}});
    await w.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'});
    return worker=w;
  })();
  try{return await wLoad}catch(e){wLoad=null;throw e}
}
const loadImg=u=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u});
async function runOcr(e){
  cur=e;e.busy=true;if($('shPl').classList.contains('open'))showPlate(e);
  try{
    const img=await loadImg(e.img),cv=document.createElement('canvas');
    cv.width=img.naturalWidth;cv.height=img.naturalHeight;cv.getContext('2d').drawImage(img,0,0);
    const w=await getWorker();
    let best={plate:'',score:-1,conf:0},pp=null;
    await w.setParameters({tessedit_pageseg_mode:'7'});
    pp=prep(cv,0);e.crop=pp.toDataURL('image/png');
    let {data}=await w.recognize(pp);let r=parsePlate(data.text);r.conf=data.confidence||0;
    if(r.score>best.score)best=r;
    if(best.score<2){
      pp=prep(cv,1);
      ({data}=await w.recognize(pp));r=parsePlate(data.text);r.conf=data.confidence||0;
      if(r.score>best.score)best=r;
    }
    e.plate=best.plate;e.conf=best.conf;e.ok=best.score===2;e.err=null;
    if(best.plate.length>=3)$('plate').textContent=best.plate;
    status(e.ok?`Plaque lue : ${best.plate}`:'Plaque incertaine',e.ok?'ok':'err');
  }catch(err){e.err=err.message;status('OCR : '+err.message,'err')}
  e.busy=false;renderHist();if(cur===e&&$('shPl').classList.contains('open'))showPlate(e);
}
function openPlate(e){if(!e)return;cur=e;showPlate(e);$('shPl').classList.add('open')}
function showPlate(e){
  $('plT').textContent=e.kmh==null?'Capture manuelle':`${fmt(conv(e.kmh))} · ${e.time.toLocaleTimeString('fr-FR')}`;
  $('plFull').src=e.img;$('bDl').href=e.img;
  if(e.crop)$('plCrop').src=e.crop;
  $('plTxt').textContent=e.busy?'Analyse…':e.err?'Erreur':(e.plate||'—');
  $('plMeta').textContent=e.err||(e.busy?'':`Confiance : ${Math.round(e.conf)} % · ${e.ok?'valide':'incertain'}`);
}
$('bRe').onclick=()=>cur&&runOcr(cur);
$('plTxt').addEventListener('blur',()=>{
  if(!cur||cur.busy)return;
  const v=$('plTxt').textContent.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
  if(v&&v!==cur.plate){cur.plate=v;$('plate').textContent=v;renderHist()}
});

/* ---------- Actions ---------- */
$('bFlip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
$('bReset').onclick=()=>{
  bgMean=null;bgVar=null;warmupFrames=0;state='IDLE';
  centroidHistory=[];hist.length=0;renderHist();
  $('dash').classList.remove('tracking','valid','over');
  $('spd').textContent='--';$('plate').textContent='-- --';
  $('dt').textContent='Temps : --';$('dir').textContent='Sens : --';
  $('arc').setAttribute('stroke-dasharray','0 170');flashT=0;
  status('Réinitialisé');
};
$('btnRetry').onclick=startCam;
$('bCsv').onclick=()=>{
  const rows=['heure;vitesse_kmh;plaque;confiance'].concat(hist.map(e=>[e.time.toISOString(),e.kmh==null?'':e.kmh.toFixed(1),e.plate,Math.round(e.conf)].join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='radar.csv';a.click();
};

/* ---------- Boot ---------- */
addEventListener('resize',sync);
addEventListener('orientationchange',()=>setTimeout(sync,400));
buildFields();updateStats();$('unit').textContent=S.unit==='mph'?'mph':'km/h';
startCam();
startLoop();
})();
</script>
</body>
</html>
